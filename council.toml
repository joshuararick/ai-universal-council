# The Council roster. Swap any model ID here, no code changes needed.
# Verify every ID (no key needed, $0):  python -m council --check

[settings]
timeout_seconds = 120
max_tokens = 1000
max_prompt_chars = 8000

# ---------------------------------------------------------------- default (paid)
[rosters.default]
